name: Validate Lost Talent

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Syntax check Cloudflare verification functions
        run: |
          node --check functions/_lib/verification.js
          node --check functions/api/verification/start.js
          node --check functions/api/verification/complete.js
          node --check functions/api/verification/member-leave.js
          node --check functions/verify.js
          node --check worker/index.js

  discord-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install bot dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check bot
        run: npm run check
